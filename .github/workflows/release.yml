name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows Release (MSVC Native)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Release Binaries
        run: cargo build --release --bin rust-exel --bin rust-exel-cli
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-exel-windows
          path: |
            target/release/rust-exel.exe
            target/release/rust-exel-cli.exe
      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          files: |
            target/release/rust-exel.exe
            target/release/rust-exel-cli.exe
